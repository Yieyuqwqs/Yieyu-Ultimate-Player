name: build

# 极速策略（见 docs/BUILD.md §极速）：
#   1) out/ 整体缓存：没改动的模块，调度器指纹直接 SKIP，连编译进程都不起
#   2) ccache（C/C++/ASM）+ sccache（Rust）+ go build cache + gradle + pub
#   3) 路径过滤：只改 go/ 就不进 native 步骤
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量重编（忽略 out 缓存）'
        type: boolean
        default: false
  push:
    branches: [main]
    # 只改文档/说明不触发构建（省 Actions 分钟）
    paths-ignore:
      - 'docs/**'
      - '*.md'          # 根目录 README/HANDOFF
      - '**/*.md'       # 任意层级
      - 'lua/**'        # 脚本资源改动不需要重编
      - 'python/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64（缓存加速）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YIEYU_OFFLINE_ASSETS: 'ON'
      YIEYU_JOBS: '4'
      CCACHE_DIR: /home/runner/.ccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
      CCACHE_BASEDIR: ${{ github.workspace }}
      GRADLE_USER_HOME: /home/runner/.gradle
    steps:
      - name: 0. 取代码（fetch-depth 0 供路径过滤）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 0.3 固定签名（首次生成并提交，之后所有构建同一签名）
        if: ${{ hashFiles('app/signing/yieyu.jks') == '' }}
        run: |
          keytool -genkeypair -v -keystore app/signing/yieyu.jks -alias yieyu \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass yieyu2026 -keypass yieyu2026 \
            -dname "CN=Yieyu Ultimate, OU=Self, O=Yieyu, L=CN, ST=CN, C=CN"
          git config user.email "actions@users.noreply.github.com"
          git config user.name "yieyu-ci"
          git add app/signing/yieyu.jks
          git commit -m "chore(signing): 生成固定签名密钥 [skip ci]"
          git push
          echo "✓ 固定签名已生成并提交，后续构建复用同一签名"
      - name: 0.1 兜底可执行位
        # ⚠️ 必须是块标量（run: |）。写成单行标量再追加缩进行，YAML 会把两行折叠成
        #    一条命令：chmod +x a b chmod +x c → "chmod: cannot access 'chmod'"（踩过）
        run: |
          chmod +x build.sh core/build-native.sh app/build-app.sh go/build.sh
          chmod +x app/patch_manifest.mjs app/patch_gradle.mjs tools/make-patch.mjs

      - name: 0.2 变更检测（决定编哪些模块）
        id: chg
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'core/**'
              - 'asm/**'
              - 'idl/**'
              - 'tools/orchestrate.mjs'
              - 'build.sh'
            go:
              - 'go/**'
            ts:
              - 'ts/**'
            app:
              - 'app/**'

      - name: 1. 恢复 out/（全部产物 + 调度器清单）
        id: ocache
        uses: actions/cache@v4
        with:
          path: out
          key: out-v2-${{ hashFiles('core/**','asm/**','idl/**','go/**','ts/**','app/**','tools/**','build.sh') }}
          restore-keys: out-v2-

      - name: 2. ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-v2-${{ hashFiles('core/**','asm/**') }}-${{ github.run_id }}
          restore-keys: ccache-v2-

      - name: 3. sccache
        id: sc
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-v2-${{ hashFiles('rust/**') }}-${{ github.run_id }}
          restore-keys: sccache-v2-

      - name: 4. Go 构建缓存
        id: gocache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ hashFiles('go/**') }}
          restore-keys: go-v2-

      - name: 5. Gradle + pub（含 build-cache，APK 步骤提速的关键）
        id: gcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.pub-cache
          # ★ 固定 key：内容变了也复用同一份缓存，增量交给 Gradle 自己判断。
          #   之前 key 里带 hashFiles(pubspec)，加一个依赖就整份缓存作废 → 每次都重下。
          key: gradle-v4-${{ runner.os }}
          restore-keys: |
            gradle-v4-
            gradle-v3-

      - name: 6. 强制全量时清空 out/
        if: inputs.force
        run: rm -rf out && echo "已清空 out/"

      # JDK 17 用 runner 预装的（不再 setup-java 下载）

      # Go 用 runner 预装的（不再 setup-go 下载）

      # Rust 已下线：模块 3/10/19 改成树内 C++（core/src/{gesture,license,store}）

      - name: 10. Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: stable, cache: true }

      # Zig 已下线：模块 4 的定长池改成树内 C++（core/src/common/mem_pool.cpp）

      - name: 11. NDK / API
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_API=26" >> $GITHUB_ENV
          # 让 Gradle 直接用这份预装 NDK，不去网上下 1GB
          echo "YIEYU_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> $GITHUB_ENV
          echo "NDK 版本: $(basename "$ANDROID_NDK_LATEST_HOME")"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"

      - name: 12. ccache（外部工具只留 ccache，flatc 已不需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version | head -1

      # LuaJIT 已下线：模块 7 用自研 Lua 子集解释器（core/src/script/minilua.cpp）

      - name: 13. 黑匣子铁律闸门
        run: |
          grep -qF '#define LOGI(...) ((void)0)' core/src/common/log.h
          grep -qF 'LOGE(...) bb_write' core/src/common/log.h
          if grep -rnE 'dlopen failed|Failed to load dynamic|降级运行|undefined symbol' app/lib; then
            echo "UI 出现底层技术报错文本"; exit 1
          fi

      - name: 14. native 层（零外部产物：idl 契约校验 + CMake）
        run: ./build.sh idl native

      - name: 15. 符号自检
        run: |
          NM=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          SO=out/native/arm64/libyieyu_core.so
          ls -lh $SO
          for sym in Yieyu_Init Yieyu_Post Yieyu_Poll Yieyu_Snapshot_Get Yieyu_Version Yieyu_ExportLogs Yieyu_ReloadScripts Yieyu_ImportScript Yieyu_PlayUrl Yieyu_ScriptCall Yieyu_Search Yieyu_PlaySong Yieyu_SetRate Yieyu_HttpProbe Yieyu_MakeKaraoke Yieyu_KaraokeStatus Yieyu_ImportPlugin Yieyu_SetPlugin Yieyu_IntegrityCheck Yieyu_SelfDigest Yieyu_KvCount Yieyu_StoreCount gesture_start gesture_poll yieyu_mem_alive; do
            $NM -D --defined-only $SO | grep -q " $sym\$" || { echo "缺导出: $sym" >&2; exit 1; }
          done
          echo "导出面 OK"

      - name: 15.5 动态依赖检查（NEEDED 里不许有绝对路径）
        run: |
          RE=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          SO=out/native/arm64/libyieyu_core.so
          echo "--- NEEDED ---"
          $RE -d $SO | grep NEEDED || true
          if $RE -d $SO | grep NEEDED | grep -q "/"; then
            echo "✗ NEEDED 里出现绝对路径 → 装机必定 dlopen 失败" >&2; exit 1
          fi
          echo "--- 16KB 对齐检查 ---"
          $RE -lW $SO | grep LOAD | head -5
          echo "✓ 动态依赖 OK"
      - name: 16. 打包 APK（内部按指纹跳过未变模块；flutter 依赖链里含模块11 混淆）
        run: ./build.sh flutter && ./build.sh verify

      - name: 16.5 混淆/防篡改产物核对
        run: |
          # 自校验摘要必须是构建期真实生成的 sha256（占位符 = 这一步没跑，等于没有防篡改）
          grep -qE "^[0-9a-f]{64}$" app/assets/integrity/libyieyu_core.sha256 || {
            echo "✗ app/assets/integrity/libyieyu_core.sha256 不是 64 位 hex" >&2; exit 1; }
          echo "自校验摘要：$(cat app/assets/integrity/libyieyu_core.sha256)"
          test -f out/obfuscate/report.md && cat out/obfuscate/report.md

      - name: 17. 增量补丁包（zip 由 node 自己打，不用系统 zip）
        run: node tools/make-patch.mjs

      - name: 18. 上传 APK + 补丁包
        uses: actions/upload-artifact@v4
        with:
          name: YieyuUltimate-apk
          path: |
            out/apk/*.apk
            out/apk/*patch*.zip
            out/verify/MANIFEST.md
          if-no-files-found: warn
          retention-days: 14

      - name: 19. 上传 .so
        uses: actions/upload-artifact@v4
        with:
          name: yieyu-native-arm64
          path: |
            out/native/arm64/*.so
          if-no-files-found: warn
          retention-days: 7

      - name: 20. 缓存自检（每个 cache 步单独报）
        if: always()
        run: |
          echo "out/      : ${{ steps.ocache.outputs.cache-hit }}"
          echo "gradle    : ${{ steps.gcache.outputs.cache-hit }}"
          echo "ccache    : ${{ steps.ccache.outputs.cache-hit }}"
          echo "sccache   : ${{ steps.sc.outputs.cache-hit }}"
          echo "go        : ${{ steps.gocache.outputs.cache-hit }}"

      - name: 20.5 缓存命中情况
        if: always()
        run: |
          echo "out/ 缓存命中: ${{ steps.ocache.outputs.cache-hit }}"
          echo "变更: native=${{ steps.chg.outputs.native }} go=${{ steps.chg.outputs.go }} ts=${{ steps.chg.outputs.ts }} app=${{ steps.chg.outputs.app }}"
          ccache --show-stats 2>/dev/null | head -8 || true


      # ── 显式保存（关键：job 失败时 actions/cache 默认**不保存**，
      #    这正是之前 out/ccache 一条缓存都没有、命中率 0% 的原因）──
      - name: 22. 保存 out/（失败也存，下次必命中）
        if: always() && steps.ocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out
          key: out-v2-${{ hashFiles('core/**','rust/**','zig/**','asm/**','idl/**','go/**','ts/**','wasm/**','app/**','tools/**','build.sh') }}

      - name: 23. 保存 ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-v2-${{ hashFiles('core/**','asm/**') }}-${{ github.run_id }}

      - name: 24. 保存 sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-v2-${{ hashFiles('rust/**') }}-${{ github.run_id }}

      - name: 25. 保存 Go 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ hashFiles('go/**') }}

      - name: 26. 保存 Gradle（失败也存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.pub-cache
          key: gradle-v4-${{ runner.os }}-${{ github.run_id }}

      - name: 21. 失败时留日志
        if: failure()
        run: |
          find out -maxdepth 3 -type f 2>/dev/null | head -40
          cat out/.build-manifest.json 2>/dev/null || true
