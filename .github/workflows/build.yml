name: build

# 极速策略（见 docs/BUILD.md §极速）：
#   1) out/ 整体缓存：没改动的模块，调度器指纹直接 SKIP，连编译进程都不起
#   2) ccache（C/C++/ASM）+ sccache（Rust）+ go build cache + gradle + pub
#   3) 路径过滤：只改 go/ 就不进 native 步骤
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量重编（忽略 out 缓存）'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64（缓存加速）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YIEYU_OFFLINE_ASSETS: 'ON'
      YIEYU_JOBS: '4'
      CCACHE_DIR: /home/runner/.ccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
      CCACHE_BASEDIR: ${{ github.workspace }}
      GRADLE_USER_HOME: /home/runner/.gradle
    steps:
      - name: 0. 取代码（fetch-depth 0 供路径过滤）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 0.3 固定签名（首次生成并提交，之后所有构建同一签名）
        if: ${{ hashFiles('app/signing/yieyu.jks') == '' }}
        run: |
          keytool -genkeypair -v -keystore app/signing/yieyu.jks -alias yieyu \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass yieyu2026 -keypass yieyu2026 \
            -dname "CN=Yieyu Ultimate, OU=Self, O=Yieyu, L=CN, ST=CN, C=CN"
          git config user.email "actions@users.noreply.github.com"
          git config user.name "yieyu-ci"
          git add app/signing/yieyu.jks
          git commit -m "chore(signing): 生成固定签名密钥 [skip ci]"
          git push
          echo "✓ 固定签名已生成并提交，后续构建复用同一签名"
      - name: 0.1 兜底可执行位
        # ⚠️ 必须是块标量（run: |）。写成单行标量再追加缩进行，YAML 会把两行折叠成
        #    一条命令：chmod +x a b chmod +x c → "chmod: cannot access 'chmod'"（踩过）
        run: |
          chmod +x build.sh core/build-native.sh app/build-app.sh go/build-aar.sh
          chmod +x app/patch_manifest.mjs app/patch_gradle.mjs tools/make-patch.mjs

      - name: 0.2 变更检测（决定编哪些模块）
        id: chg
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'core/**'
              - 'rust/**'
              - 'zig/**'
              - 'asm/**'
              - 'idl/**'
              - 'tools/orchestrate.mjs'
              - 'build.sh'
            go:
              - 'go/**'
            ts:
              - 'ts/**'
            app:
              - 'app/**'

      - name: 1. 恢复 out/（全部产物 + 调度器清单）
        id: ocache
        uses: actions/cache@v4
        with:
          path: out
          key: out-v2-${{ hashFiles('core/**','rust/**','zig/**','asm/**','idl/**','go/**','ts/**','wasm/**','app/**','tools/**','build.sh') }}
          restore-keys: out-v2-

      - name: 2. ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-v2-${{ hashFiles('core/**','asm/**') }}-${{ github.run_id }}
          restore-keys: ccache-v2-

      - name: 3. sccache
        id: sc
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-v2-${{ hashFiles('rust/**') }}-${{ github.run_id }}
          restore-keys: sccache-v2-

      - name: 4. Go 构建缓存
        id: gocache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ hashFiles('go/**') }}
          restore-keys: go-v2-

      - name: 5. Gradle + pub（含 build-cache，APK 步骤提速的关键）
        id: gcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.pub-cache
          # ★ 固定 key：内容变了也复用同一份缓存，增量交给 Gradle 自己判断。
          #   之前 key 里带 hashFiles(pubspec)，加一个依赖就整份缓存作废 → 每次都重下。
          key: gradle-v4-${{ runner.os }}
          restore-keys: |
            gradle-v4-
            gradle-v3-

      - name: 6. 强制全量时清空 out/
        if: inputs.force
        run: rm -rf out && echo "已清空 out/"

      - name: 7. JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: 8. Go 1.22
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: 9. Rust + android target
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android, components: rustfmt }

      - name: 10. Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: stable, cache: true }

      - name: 10.5 Zig 0.13
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: 11. NDK / API
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_API=26" >> $GITHUB_ENV
          # 让 Gradle 直接用这份预装 NDK，不去网上下 1GB
          echo "YIEYU_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> $GITHUB_ENV
          echo "NDK 版本: $(basename "$ANDROID_NDK_LATEST_HOME")"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"

      - name: 12. ccache / flatc / gomobile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache flatbuffers-compiler zip unzip
          ccache --version | head -1
          flatc --version
          zig version
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: 12.5 LuaJIT（模块 7，编不出来就降级，不阻塞）
        run: |
          set +e
          TC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git /tmp/luajit 2>&1 | tail -2
          cd /tmp/luajit || exit 0
          make -j4 HOST_CC="gcc" \
            CC="$TC/aarch64-linux-android26-clang" \
            TARGET_SYS=Linux TARGET_FLAGS="-D__ANDROID_API__=26 -fPIC" \
            BUILDMODE=static amalg 2>&1 | tail -25
          if [ -f src/libluajit.a ]; then
            mkdir -p "$GITHUB_WORKSPACE/third_party/lua/lib" "$GITHUB_WORKSPACE/third_party/lua/include"
            cp src/libluajit.a "$GITHUB_WORKSPACE/third_party/lua/lib/"
            cp src/lua.h src/lauxlib.h src/lualib.h src/luaconf.h "$GITHUB_WORKSPACE/third_party/lua/include/"
            echo "✓ LuaJIT 编好了：$(ls -lh src/libluajit.a | awk '{print $5}')"
            echo "LUAJIT_OK=1" >> $GITHUB_ENV
          else
            echo "⚠ LuaJIT 没编出来，本次走 stub（导入/校验照常，执行返回 -2）"
          fi
      - name: 13. 黑匣子铁律闸门
        run: |
          grep -qF '#define LOGI(...) ((void)0)' core/src/common/log.h
          grep -qF 'LOGE(...) bb_write' core/src/common/log.h
          if grep -rnE 'dlopen failed|Failed to load dynamic|降级运行|undefined symbol' app/lib; then
            echo "UI 出现底层技术报错文本"; exit 1
          fi

      - name: 14. native 层（仅变更或缓存未命中）
        if: steps.chg.outputs.native == 'true' || steps.ocache.outputs.cache-hit != 'true' || inputs.force
        run: ./build.sh zig idl rust native

      - name: 15. 符号自检
        run: |
          NM=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          SO=out/native/arm64/libyieyu_core.so
          ls -lh $SO
          for sym in Yieyu_Init Yieyu_Post Yieyu_Poll Yieyu_Snapshot_Get Yieyu_Version Yieyu_ExportLogs Yieyu_ReloadScripts Yieyu_ImportScript; do
            $NM -D --defined-only $SO | grep -q " $sym\$" || { echo "缺导出: $sym" >&2; exit 1; }
          done
          echo "导出面 OK"

      - name: 16. 打包 APK（内部按指纹跳过未变模块）
        run: ./build.sh flutter && ./build.sh verify

      - name: 17. 增量补丁包
        run: |
          node tools/make-patch.mjs
          cd out/patch && zip -qr "../apk/YieyuUltimate-patch-${GITHUB_SHA::7}.zip" . && cd -
          ls -lh out/apk/

      - name: 18. 上传 APK + 补丁包
        uses: actions/upload-artifact@v4
        with:
          name: YieyuUltimate-apk
          path: |
            out/apk/*.apk
            out/apk/*patch*.zip
            out/verify/MANIFEST.md
          if-no-files-found: warn
          retention-days: 14

      - name: 19. 上传 .so
        uses: actions/upload-artifact@v4
        with:
          name: yieyu-native-arm64
          path: |
            out/native/arm64/*.so
            out/rust/**/release/*.so
          if-no-files-found: warn
          retention-days: 7

      - name: 20. 缓存自检（每个 cache 步单独报）
        if: always()
        run: |
          echo "out/      : ${{ steps.ocache.outputs.cache-hit }}"
          echo "gradle    : ${{ steps.gcache.outputs.cache-hit }}"
          echo "ccache    : ${{ steps.ccache.outputs.cache-hit }}"
          echo "sccache   : ${{ steps.sc.outputs.cache-hit }}"
          echo "go        : ${{ steps.gocache.outputs.cache-hit }}"

      - name: 20.5 缓存命中情况
        if: always()
        run: |
          echo "out/ 缓存命中: ${{ steps.ocache.outputs.cache-hit }}"
          echo "变更: native=${{ steps.chg.outputs.native }} go=${{ steps.chg.outputs.go }} ts=${{ steps.chg.outputs.ts }} app=${{ steps.chg.outputs.app }}"
          ccache --show-stats 2>/dev/null | head -8 || true


      # ── 显式保存（关键：job 失败时 actions/cache 默认**不保存**，
      #    这正是之前 out/ccache 一条缓存都没有、命中率 0% 的原因）──
      - name: 22. 保存 out/（失败也存，下次必命中）
        if: always() && steps.ocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out
          key: out-v2-${{ hashFiles('core/**','rust/**','zig/**','asm/**','idl/**','go/**','ts/**','wasm/**','app/**','tools/**','build.sh') }}

      - name: 23. 保存 ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-v2-${{ hashFiles('core/**','asm/**') }}-${{ github.run_id }}

      - name: 24. 保存 sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-v2-${{ hashFiles('rust/**') }}-${{ github.run_id }}

      - name: 25. 保存 Go 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ hashFiles('go/**') }}

      - name: 26. 保存 Gradle（失败也存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/.pub-cache
          key: gradle-v4-${{ runner.os }}-${{ github.run_id }}

      - name: 21. 失败时留日志
        if: failure()
        run: |
          find out -maxdepth 3 -type f 2>/dev/null | head -40
          cat out/.build-manifest.json 2>/dev/null || true
