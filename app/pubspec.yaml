name: yieyu_ultimate
description: "Yieyu Ultimate Player · 纯血安卓 24 大技术巅峰架构（全自研，零第三方二进制）"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # [24] dart:ffi 直连 C++ JSB（ffi 包已拔：自己写了 ffi_shim.dart）
  # 文件选择器/目录：走自己的平台通道（lib/platform/native_channel.dart），不用第三方插件

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/integrity/
    - assets/plugins/
    - assets/scripts/
