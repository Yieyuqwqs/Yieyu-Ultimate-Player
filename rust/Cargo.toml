# 模块 3 / 10 / 19。三个 crate 只干一件事，互不依赖。
[workspace]
resolver = "2"
members = ["gesture-tokio", "license-ring", "store-read"]

[workspace.package]
edition = "2021"
rust-version = "1.79"
license = "MIT"

[workspace.dependencies]
# 全部零依赖：模块3/19 用 std，模块10 的 SHA-256/HMAC 也自己写

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"      # 音频进程不留 panic 展开表
strip = "symbols"    # 配合模块 11，先剥一层是一层
