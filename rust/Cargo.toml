# 模块 3 / 10 / 19。三个 crate 只干一件事，互不依赖。
[workspace]
resolver = "2"
members = ["gesture-tokio", "license-ring", "store-read"]

[workspace.package]
edition = "2021"
rust-version = "1.79"
license = "MIT"

[workspace.dependencies]
# rt-multi-thread：[3] 手势状态机要真多线程 runtime；rt/fs：[19] 异步只读；sync/macros 两边都要
tokio = { version = "1.39", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "fs", "io-util"] }
ring  = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"      # 音频进程不留 panic 展开表
strip = "symbols"    # 配合模块 11，先剥一层是一层
